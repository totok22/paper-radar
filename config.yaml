# ============ paper-radar 配置 ============
# 密钥一律走环境变量 / GitHub Secrets，不要写进本文件：
#   LLM_API_KEY LLM_BASE_URL LLM_MODEL FEISHU_WEBHOOK FEISHU_SECRET
#   S2_API_KEY OPENALEX_API_KEY OPENALEX_EMAIL EMBED_API_KEY EMBED_BASE_URL EMBED_MODEL

lookback_days: 3            # 召回最近 N 天（周一建议 ≥3 覆盖周末）
state_db: data/state.sqlite # 已推送历史 + 反馈 + 缓存
report_dir: reports
dedup_fuzzy: 0.93           # 标题模糊去重阈值

sources:
  arxiv:
    enabled: true
    full_categories: [cs.RO, eess.SY, cs.SY]   # 全量召回。eess.SY 一直在；cs.SY 补控制系统论文
    keyword_categories: [cs.CV, cs.LG, cs.AI]  # 大类：只召回含以下关键词的
    keywords: ["autonomous driving", "self-driving", "autonomous vehicle", "motion planning",
               "trajectory", "traffic scenario", "driving scenario", "vehicle", "motion primitive",
               "model predictive control", "safety-critical", "traffic simulation",
               "path tracking", "vehicle dynamics", "tire model", "lateral control",
               "longitudinal control", "lane keeping", "adaptive cruise"]
    page_size: 200
    max_results: 1500
  openalex:
    enabled: true            # 每个子方向用 query 做检索（含期刊/会议正式发表）
    per_query: 40
  journals:
    enabled: true            # 目标期刊新文章（OpenAlex 按 ISSN，替代不稳定的 IEEE RSS）
    lookback_days: 10
    max_pages: 3
    issns:
      T-ITS: 1524-9050
      T-IV: 2379-8858
      RA-L: 2377-3766
      T-RO: 1552-3098
      TVT: 0018-9545
      TCST: 1063-6536
      VSD: 0042-3114             # Vehicle System Dynamics（Taylor & Francis）
      CEP: 0967-0661             # Control Engineering Practice（Elsevier）
  semantic_scholar:
    enabled: true            # S2 推荐：正/负种子 + 你的反馈 → 相似新论文
    limit: 80                # 每个子方向一条推荐请求（全局限速 1.1s，见 s2.py）
    min_interval: 1.1        # 账号限额：所有 S2 端点合计 1 req/s
    max_requests: 300        # 单次运行硬上限，正常一天大约十几次
    batch_size: 500          # paper/batch、author/batch 每批条数（接口上限 500）
    lookback_days: 14        # 推荐结果常是稍旧的经典论文，单独放宽，不跟日报的 3 天共用
    max_failures: 2          # 连续两个子方向失败就跳过剩余 S2，别把时间耗在重试上
    retries: 2               # 推荐请求的尝试次数（原来 4 次，失败一个子方向要等半分钟）
  rss:
    enabled: false           # 通用 RSS 插槽
    feeds: {}
  deepseek_search:
    enabled: true            # DeepSeek 网页搜索，用 LLM_API_KEY；没 key 就跳过
    queries_per_topic: 3     # 每个子方向：arXiv、IEEE/ScienceDirect、OpenReview 变体
    count: 50                # 每次 1–50 条；按请求计费，不按条数
    min_rerank_score: 1.0    # 官方把 >=1.5 视为高质量；1.0 多留一些再交给去重和领域过滤
    lookback_days: 7         # 查询里的 after: 日期。返回的 date 可能是抓取时间，不当作发表日期
    max_requests: 48         # 11 个子方向 × 3 ≈ 33，再加 4 条运动控制专用查询
    doi_lookups: 20          # 没有 arXiv id / DOI 时，用标题问 OpenAlex，不够再问 Crossref
    biblio_lookups: 24       # 已有 DOI 但缺作者或日期时，按 DOI 问 OpenAlex / Crossref（不计搜索费）
    base_url: https://api.deepseek.com
    allow_domains:           # 不在表里的站点（博客、CSDN、GitHub、个人主页）直接丢掉
      - arxiv.org
      - doi.org
      - ieeexplore.ieee.org
      - sciencedirect.com
      - link.springer.com
      - dl.acm.org
      - openreview.net
      - proceedings.mlr.press
      - proceedings.neurips.cc
      - openaccess.thecvf.com
      - thecvf.com
      - aaai.org
      - ijcai.org
      - onlinelibrary.wiley.com
      - iopscience.iop.org
      - mdpi.com
      - frontiersin.org
      - nature.com
      - science.org
      - ascelibrary.org
      - journals.sagepub.com
      - tandfonline.com
      - hal.science
      - semanticscholar.org

embedding:                   # 预筛：配了 API 用 API；否则 local_model；再否则 TF-IDF
  # base_url: https://api.siliconflow.cn/v1
  # model: BAAI/bge-m3
  local_model: ""            # 例如 BAAI/bge-small-en-v1.5（需 pip install sentence-transformers）
  negative_weight: 0.5

llm:                         # OpenAI 兼容；无 key 时自动降级为启发式评分
  base_url: https://api.deepseek.com   # 也可写 https://api.deepseek.com/v1
  model: deepseek-flash                # 本账号可用：deepseek-flash、deepseek-v4-pro
  batch_size: 4
  concurrency: 2
  max_retries: 2
  json_mode: true

quality:
  hf_upvotes: true
  author_hindex: true        # S2 paper/batch；缺 h-index 时再走一次 author/batch
  openreview: true
  openreview_limit: 8

ranking:
  top_k: 40                  # 进入 LLM 精排的数量
  top_n: 12                  # 最终推送数量
  per_topic_max: 3
  mmr_lambda: 0.72           # 越小越多样
  exploration_slots: 1       # 留给还没被代表的子方向
  direction_keep: 6          # 每个方向在 LLM 池里至少留这么多（更低的嵌入门槛，见下）
  direction_min_emb: 0.22    # 方向保底用的嵌入门槛，低于全局 min_emb，只换掉已经超额的方向
  per_direction_min: 1       # 最终日报里每个有候选的方向至少 1 篇
  direction_mins:            # 运动控制单独要 2 篇；没有合格候选就留空，不用域外论文填
    运动控制: 2
  min_emb: 0.35              # 嵌入分低于此值丢掉；不够 min_keep 时仍保底
  min_keep: 8
  min_relevance: 5           # LLM 相关度低于此值丢弃
  weights: {relevance: 0.4, novelty: 0.15, rigor: 0.15, embedding: 0.15, quality: 0.15}

pdf:
  unpaywall: true            # DOI → Unpaywall。邮箱用 OPENALEX_EMAIL / UNPAYWALL_EMAIL
  lookup_limit: 12           # 只对最终入选的论文做 OA / arXiv / DeepSeek 查询
  arxiv_title: true          # 没有 arXiv id 时按标题检索 export.arxiv.org（自带 3 秒间隔）
  deepseek_fallback: true    # 仍无 PDF 时才用 DeepSeek 搜索，查询不超过 128 字符
  deepseek_limit: 8
  hal: true                  # HAL：法国机构仓库，机器人/控制方向命中率高，无需鉴权
  hal_limit: 8
  core: true                 # CORE：机构仓库聚合，需要免费的 CORE_API_KEY（或 core_api_key）
  core_api_key: ""
  core_limit: 6
  openaire: true             # OpenAIRE Graph：绿色 OA，未认证约 60 次/小时
  openaire_limit: 4
  byte_timeout: 8            # 候选链接做 Range 请求，正文须以 %PDF 开头
  byte_fail_limit: 3         # 同一域名连续失败这多次后，本次运行不再请求它
  empty_cache_days: 10       # 没找到 PDF 的缓存过期天数（7–14）
  push_top_n: 5              # 自建应用实际发送的 PDF 篇数（未配置应用则不发送）
  max_bytes: 20971520        # 20MB，低于飞书 30MB 上传限制

# 无开放获取 PDF 的期刊论文：北京理工大学 WebVPN + CARSI。enabled: false 可关。
institution:
  enabled: true
  name: 北京理工大学
  idp: https://idp.bit.edu.cn/idp/shibboleth
  webvpn_base: https://webvpn.bit.edu.cn
  webvpn_key: wrdvpnisthebest!

weekly:
  weekday: 0                 # 周一附带周报；-1 关闭
  days: 7

zotero:                      # 可选：以后接 Zotero（pip install pyzotero），见 README
  enabled: false
  library_type: user
  collection_map: {}

# ============ 兴趣子方向（来自课题组方向图） ============
# positive: 正种子（S2 可识别的 ID：ARXIV:xxxx / DOI:xxx）；negative: 文本或 {id,title}
topics:
  # ---------- 运动规划 ----------
  - id: plan_llm_primitive
    direction: 运动规划
    name: 大模型驱动的行为基元库增量式扩展
    query: large language model autonomous driving behavior decision planning
    description: >-
      Using large language models (LLMs) as reasoning/decision makers for autonomous driving motion planning;
      knowledge-driven driving with memory and reflection; building and incrementally expanding a library of
      driving behavior primitives / skills (lane change, overtaking, yielding, merging) with LLM reasoning,
      code generation or continual learning.
    positive:
      - {id: "ARXIV:2311.01043", title: "LLM4Drive: A Survey of Large Language Models for Autonomous Driving"}
      - {id: "ARXIV:2309.16292", title: "DiLu: A Knowledge-Driven Approach to Autonomous Driving with Large Language Models"}
      - {id: "ARXIV:2307.07162", title: "Drive Like a Human: Rethinking Autonomous Driving with Large Language Models"}
      - {id: "ARXIV:2310.01415", title: "GPT-Driver: Learning to Drive with GPT"}
    negative:
      - "medical question answering large language model benchmark"
  - id: plan_vlm_scene_behavior
    direction: 运动规划
    name: 视觉语言大模型-场景行为映射
    query: vision language model autonomous driving planning
    description: >-
      Vision-language models (VLMs / multimodal LLMs) that map driving scenes (camera images, BEV, scene graphs)
      to driving behaviors, meta-actions or trajectories; end-to-end driving with VLMs, driving VQA,
      chain-of-thought reasoning for planning, dual fast/slow systems combining VLM and classical planners.
    positive:
      - {id: "ARXIV:2310.14414", title: "Vision Language Models in Autonomous Driving: A Survey and Outlook"}
      - {id: "ARXIV:2311.12320", title: "A Survey on Multimodal Large Language Models for Autonomous Driving"}
      - {id: "ARXIV:2402.12289", title: "DriveVLM: The Convergence of Autonomous Driving and Large Vision-Language Models"}
      - {id: "ARXIV:2312.14150", title: "DriveLM: Driving with Graph Visual Question Answering"}
      - {id: "ARXIV:2410.23262", title: "EMMA: End-to-End Multimodal Model for Autonomous Driving"}
      - {id: "ARXIV:2212.10156", title: "Planning-oriented Autonomous Driving (UniAD)"}
  - id: plan_primitive_dmp
    direction: 运动规划
    name: 基元的扩展与选择 + DMP 算法
    query: dynamical movement primitives trajectory generation
    description: >-
      Motion primitives and dynamical movement primitives (DMP) for on-road vehicles: learning,
      generalization, expansion and selection of driving primitives from demonstrations; primitive-based
      trajectory generation and motion planning for autonomous vehicles; probabilistic movement primitives;
      skill libraries and primitive selection. Robot-arm DMPs count only when the paper transfers them to driving.
    positive:
      - {id: "DOI:10.1162/NECO_a_00393", title: "Dynamical Movement Primitives: Learning Attractor Models for Motor Behaviors"}
      - {id: "ARXIV:1604.07446", title: "A Survey of Motion Planning and Control Techniques for Self-driving Urban Vehicles"}

  # ---------- 运动控制 ----------
  - id: ctrl_scene_similarity_param
    direction: 运动控制
    name: 场景相似度驱动的控制参量优化
    query: scenario adaptive controller parameter tuning autonomous vehicle
    description: >-
      Adaptive tuning and optimization of vehicle controller parameters (MPC weights, PID / LQR gains) driven by
      driving scenario similarity or scenario classification; Bayesian optimization, learning-based or
      meta-learning based controller parameter adaptation across driving conditions and road scenarios.
    positive:
      - {id: "ARXIV:2310.03026", title: "LanguageMPC: Large Language Models as Decision Makers for Autonomous Driving"}
    extra_queries:
      - vehicle controller gain Bayesian optimization scenario adaptive
  - id: ctrl_vlm_scene_param
    direction: 运动控制
    name: 视觉语言大模型-场景参量映射
    query: language model controller parameters MPC autonomous driving
    description: >-
      Using LLMs or VLMs to map driving scene understanding to low-level control or planning parameters,
      e.g. generating MPC cost weights, constraints or controller configurations from language/vision;
      foundation models interfacing with optimization-based controllers.
    positive:
      - {id: "ARXIV:2310.03026", title: "LanguageMPC: Large Language Models as Decision Makers for Autonomous Driving"}
      - {id: "ARXIV:2402.12289", title: "DriveVLM: The Convergence of Autonomous Driving and Large Vision-Language Models"}
    extra_queries:
      - vision language model MPC weights autonomous vehicle
  - id: ctrl_traj_dynamics_learning
    direction: 运动控制
    name: 轨迹特征聚类与动力学参量学习
    query: vehicle dynamics model learning parameter identification trajectory data
    description: >-
      Trajectory feature extraction and clustering of driving data; learning or identifying vehicle dynamics
      parameters (tire model, cornering stiffness, mass) from data; data-driven / neural vehicle dynamics models,
      Gaussian-process or physics-informed models for control.
    positive:
      - {id: "DOI:10.1109/IVS.2015.7225830", title: "Kinematic and Dynamic Vehicle Models for Autonomous Driving Control Design"}
    extra_queries:
      - tire model cornering stiffness vehicle dynamics identification
  - id: ctrl_mpc
    direction: 运动控制
    name: MPC 与车辆控制器部署
    query: model predictive control autonomous vehicle trajectory tracking
    description: >-
      Model predictive control (MPC, nonlinear MPC, learning-based MPC) for autonomous vehicle path tracking and
      motion control, real-time embedded deployment of vehicle controllers, real-vehicle experiments, bicycle models.
    positive:
      - {id: "DOI:10.1109/IVS.2015.7225830", title: "Kinematic and Dynamic Vehicle Models for Autonomous Driving Control Design"}
      - {id: "ARXIV:1604.07446", title: "A Survey of Motion Planning and Control Techniques for Self-driving Urban Vehicles"}
    extra_queries:
      - learning-based MPC path tracking lateral longitudinal real vehicle

  # ---------- 场景生成 ----------
  - id: scen_adversarial
    direction: 场景生成
    name: 车辆约束下的对抗场景生成
    query: adversarial safety-critical scenario generation autonomous driving
    description: >-
      Adversarial and safety-critical driving scenario generation for testing autonomous vehicles under vehicle
      constraints; adversarial agents, corner cases, falsification, reinforcement-learning based scenario search,
      plausibility of generated accidents.
    positive:
      - {id: "ARXIV:2202.02215", title: "A Survey on Safety-Critical Driving Scenario Generation: A Methodological Perspective"}
      - {id: "ARXIV:2101.06549", title: "AdvSim: Generating Safety-Critical Scenarios for Self-Driving Vehicles"}
      - {id: "ARXIV:2112.05077", title: "STRIVE: Generating Useful Accident-Prone Driving Scenarios via a Learned Traffic Prior"}
      - {id: "ARXIV:2204.13683", title: "KING: Generating Safety-Critical Driving Scenarios for Robust Imitation via Kinematics Gradients"}
  - id: scen_diffusion
    direction: 场景生成
    name: 基于扩散模型的动态场景生成
    query: diffusion model traffic scenario generation
    description: >-
      Diffusion models and other generative models for dynamic traffic scenario generation and traffic simulation:
      multi-agent trajectory generation, scene initialization and rollout, controllable / guided diffusion.
    positive:
      - {id: "ARXIV:2210.17366", title: "CTG: Guided Conditional Diffusion for Controllable Traffic Simulation"}
      - {id: "ARXIV:2305.18452", title: "Generating Driving Scenes with Diffusion"}
      - {id: "ARXIV:2412.12129", title: "SceneDiffuser: Efficient and Controllable Driving Simulation Initialization and Rollout"}
    negative:
      - "text-to-image diffusion image editing portrait"
  - id: scen_kinematic_constrained
    direction: 场景生成
    name: 车辆运动学约束的场景生成
    query: kinematically feasible trajectory generation traffic simulation
    description: >-
      Scenario and trajectory generation that enforces vehicle kinematic / dynamic feasibility constraints,
      physically plausible multi-agent traffic simulation, rule- or STL-guided generation, differentiable kinematics.
    positive:
      - {id: "ARXIV:2204.13683", title: "KING: Generating Safety-Critical Driving Scenarios for Robust Imitation via Kinematics Gradients"}
      - {id: "ARXIV:2210.17366", title: "CTG: Guided Conditional Diffusion for Controllable Traffic Simulation"}
  - id: scen_data_management
    direction: 场景生成
    name: 场景数据管理、标注与后处理
    query: driving scenario database extraction annotation
    description: >-
      Driving scenario data management: scenario extraction and mining from naturalistic driving data,
      scenario description languages (OpenSCENARIO), annotation and labeling tools, scenario databases,
      post-processing software and toolchains for simulation-based testing.
    positive:
      - {id: "ARXIV:2202.02215", title: "A Survey on Safety-Critical Driving Scenario Generation: A Methodological Perspective"}
